<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hofstadler AllSkyCam</title>
    <link rel="stylesheet" type="text/css" href="font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="css/custom.css">
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 0; }
        .header { display: flex; align-items: center; padding: 10px; background: #111; }
        .btn-allsky { background: #555; color: #fff; padding: 4px 10px; border-radius: 4px; text-decoration: none; margin-right: 15px; font-weight: bold; }
        .title { font-size: 1.2rem; font-weight: normal; }
        .aurora { padding: 10px; font-size: 0.9rem; font-weight: bold; }
        .main-container { position: relative; display: inline-block; width: 100%; text-align: center; }
        .img-container { position: relative; display: inline-block; max-width: 100%; }
        .img-container img { max-width: 100%; height: auto; display: block; }
        .left-menu { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.5); border: 1px solid #555; border-radius: 6px; display: flex; flex-direction: column; padding: 5px; gap: 8px; z-index: 10; }
        .left-menu i { color: #ccc; font-size: 1.2rem; padding: 5px; cursor: pointer; }
        .footer-link { position: fixed; bottom: 10px; right: 10px; color: #888; text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="header">
        <span class="btn-allsky">Allsky</span>
        <span class="title">Hofstadler AllSkyCam</span>
    </div>

    <div id="aurora-container" class="aurora">
        Aurora activity: Loading...
    </div>

    <div class="main-container">
        <div class="img-container">
            <div class="left-menu">
                <i class="fa fa-line-chart" title="Analytics"></i>
                <i class="fa fa-play-circle" title="Timelapse"></i>
                <i class="fa fa-bars" title="Keogram"></i>
                <i class="fa fa-star" title="Startrails"></i>
                <i class="fa fa-arrows-alt" title="Full Screen"></i>
                <i class="fa fa-info-circle" title="Information"></i>
            </div>
            <img id="current-image" src="image.jpg" alt="Allsky Live Image">
        </div>
    </div>

    <a href="https://github.com/thomasjacquin/allsky" class="footer-link"><i class="fa fa-tools"></i> Build your own</a>

    <script>
        // Aurora-Daten automatisch aus der hochgeladenen data.json laden
        async function loadAuroraData() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                if (data && data.aurora) {
                    document.getElementById('aurora-container').innerHTML = 'Aurora activity: ' + data.aurora;
                } else {
                    document.getElementById('aurora-container').innerHTML = 'Aurora activity: <span style="color:#f39c12">Sep 24: Unsettled</span> <span style="color:#f39c12">Sep 25: Unsettled</span> <span style="color:#2ecc71">Sep 26: Quiet</span>';
                }
            } catch (e) {
                document.getElementById('aurora-container').innerHTML = 'Aurora activity: <span style="color:#f39c12">Sep 24: Unsettled</span> <span style="color:#f39c12">Sep 25: Unsettled</span> <span style="color:#2ecc71">Sep 26: Quiet</span>';
            }
        }
        loadAuroraData();
    </script>
</body>
</html>
