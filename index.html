<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cosmic Cathedral AllSkyCam</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 0; }
        .header { display: flex; align-items: center; padding: 10px; background: #111; }
        .btn-allsky { background: #555; color: #fff; padding: 4px 10px; border-radius: 4px; text-decoration: none; margin-right: 15px; font-weight: bold; }
        .title { font-size: 1.2rem; font-weight: normal; }
        .aurora { padding: 10px; font-size: 0.9rem; font-weight: bold; }
        .main-container { text-align: center; width: 100%; }
        .img-container { display: inline-block; max-width: 100%; }
        .img-container img { max-width: 100%; height: auto; display: block; }
        .footer-link { position: fixed; bottom: 10px; right: 10px; color: #888; text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="header">
        <span class="btn-allsky">Allsky</span>
        <span class="title">DEIN NEUER NAME</span>
    </div>

    <div class="aurora">
        Aurora activity: <span style="color:#f39c12">Unsettled</span>
    </div>

    <div class="main-container">
        <div class="img-container">
            <img src="image.jpg" alt="Allsky Live Image">
        </div>
    </div>

    <a href="https://github.com/thomasjacquin/allsky" class="footer-link">Build your own</a>
</body>
</html>
