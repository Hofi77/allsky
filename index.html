<!DOCTYPE html>
<html lang="de">
<head>

    <title>Hofstadler AllSkyCam</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        header {
            background-color: #111;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

            margin: 0;

        .container {
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        img.live-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;

        }

</head>

    <header>
        <h1>Hofstadler AllSkyCam</h1>
